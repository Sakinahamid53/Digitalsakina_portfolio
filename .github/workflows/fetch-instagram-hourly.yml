name: Fetch Instagram Posts Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm run fetch-instagram
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add instagram-posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Update Instagram posts - $(date '+%Y-%m-%d %H:%M:%S')" && git push)
