<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakina | Digital Designer</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    body { font-family: 'DM Sans', sans-serif; overflow-x: hidden; }
    h1, h2, h3 { font-family: 'Fraunces', serif; }

    .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s ease; }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    .project-card { transition: transform 0.4s ease, box-shadow 0.4s ease; cursor:pointer; }
    .project-card:hover { transform: scale(1.03); }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 20px;
    }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 650px;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      animation: pop 0.25s ease;
    }

    .modal-img { width: 100%; height: 320px; object-fit: cover; }

    .modal-body { padding: 20px; }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: white;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @keyframes pop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* WHATSAPP */
    .whatsapp-float {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: #25D366;
      color: white;
      padding: 12px 16px;
      border-radius: 50px;
      display: flex;
      gap: 10px;
      align-items: center;
      text-decoration: none;
      font-weight: 600;
      z-index: 9999;
    }

    .whatsapp-icon { width: 22px; height: 22px; }
  </style>
</head>

<body>

<!-- PROJECT CARD -->
<div class="project-card" onclick="openModal(this)"
     data-title="COSRX Snail Essence"
     data-img="https://via.placeholder.com/600"
     data-desc="COSRX Advanced Snail 96 Mucin Essence deeply hydrates and repairs skin barrier.">

  <img src="https://via.placeholder.com/400" style="width:100%">
</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal-card">
    <img id="modalImg" class="modal-img">
    <div class="modal-body">
      <h2 id="modalTitle"></h2>
      <p id="modalDesc"></p>
    </div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
</div>

<!-- WHATSAPP -->
<a class="whatsapp-float" href="https://wa.me/255686210125" target="_blank">
  <svg class="whatsapp-icon" viewBox="0 0 32 32">
    <path fill="white" d="M16 3C9.3 3 4 8.3 4 15c0 2.6.8 5 2.3 7L4 29l7.3-2.3C13 27.5 14.5 28 16 28c6.7 0 12-5.3 12-12S22.7 3 16 3z"/>
  </svg>
  WhatsApp Me
</a>

<script>
  function openModal(el){
    document.getElementById("modal").style.display = "flex";
    document.getElementById("modalTitle").innerText = el.dataset.title;
    document.getElementById("modalImg").src = el.dataset.img;
    document.getElementById("modalDesc").innerText = el.dataset.desc;
  }

  function closeModal(){
    document.getElementById("modal").style.display = "none";
  }

  function closeModalOutside(e){
    if(e.target.id === "modal") closeModal();
  }

  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape") closeModal();
  });
</script>

</body>
</html>
